<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENPEEP — Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
}
.empty-icon {
  font-size: 64px;
  margin-bottom: 20px;
}
.empty-title {
  font-size: 22px;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 8px;
}
.empty-sub {
  font-size: 14px;
  color: #64748b;
  max-width: 320px;
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="nav-logo">
      <div class="nav-logo-icon">BLR</div>
      <span class="nav-logo-text">CENPEEP</span>
    </div>
    <div class="nav-links">
      <a href="calculator.html" class="nav-link">Calculation</a>
      <a href="sessions.html" class="nav-link active">Sessions</a>
    </div>
    <button class="nav-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container" style="padding-top:60px;">
  <div class="empty-state">
    <div class="empty-icon">📋</div>
    <div class="empty-title">Sessions</div>
    <div class="empty-sub">Session history will appear here once connected to the database.</div>
  </div>
</div>

<script>
if (!sessionStorage.getItem('loggedIn')) {
  window.location.href = 'index.html';
}
function logout() {
  sessionStorage.removeItem('loggedIn');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
